<!-- The grid of the Score page: the semantic sources at the top left, the semantic playground at the top right, and the timeline along the
     bottom (about a fifth of the screen). Each block is filled by its own module in web/score/blocks/ (data-block = file name). Aimed at 1920 x 1080. -->
<div id="demo" class="score">
  <div class="grid">
    <section class="frame" data-block="sources"></section>
    <section class="frame" data-block="playground"></section>
    <section class="frame" data-block="timeline"></section>
  </div>
</div>
