<!-- The grid of the page: three columns, two rows. Each block is filled by its own module in web/live/blocks/ (data-block = file name).
     Top row: clusters = the semantic sources panel, view3d = the atlas panel, effects = the fx panel.
     Bottom row: plane = the semantic playground, disk = the structure playground, generation = the model (info) panel. -->
<div id="demo">
  <div class="grid">
    <section class="frame" data-block="clusters"></section>
    <section class="frame" data-block="view3d"></section>
    <section class="frame" data-block="effects"></section>
    <section class="frame" data-block="plane"></section>
    <section class="frame" data-block="disk"></section>
    <section class="frame" data-block="generation"></section>
  </div>
</div>
